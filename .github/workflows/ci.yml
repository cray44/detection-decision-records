name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov=ddr --cov-report=term-missing

  schema-drift:
    name: Schema drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Regenerate schema and assert no drift
        run: |
          python -m ddr._internal.schema_export --output /tmp/regenerated.schema.json
          diff -u spec/ddr-v0.1.schema.json /tmp/regenerated.schema.json

  examples:
    name: Validate worked examples
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ddr validate examples/
      # export-splunk requires sigma-to-spl (sibling editable install, not on PyPI).
      # Install from a sibling checkout if present; skip gracefully otherwise.
      - name: Export Splunk fragments (requires sigma-to-spl)
        run: |
          if [ -d "../sigma-to-spl" ]; then
            pip install -e ../sigma-to-spl
            ddr export-splunk examples/01-psexec-admin-suppression/ddr.yml
            ddr export-splunk examples/02-nessus-network-scanner/ddr.yml
            ddr export-splunk examples/03-scheduled-task-vendor-noise/ddr.yml
          else
            echo "sigma-to-spl not found at ../sigma-to-spl — skipping export-splunk check"
          fi
