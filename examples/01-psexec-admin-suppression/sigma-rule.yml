title: PsExec Tool Execution
id: 4a6a3b37-1bef-4741-ae2d-c34cca8c8e77
status: test
description: Detects PsExec execution, which may indicate lateral movement or remote administration.
references:
  - https://docs.microsoft.com/en-us/sysinternals/downloads/psexec
  - https://attack.mitre.org/techniques/T1570/
author: Florian Roth (Nextron Systems)
date: 2022-07-20
modified: 2023-09-07
tags:
  - attack.execution
  - attack.t1569.002
  - attack.lateral_movement
  - attack.t1570
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - \PsExec.exe
      - \PsExec64.exe
    OriginalFileName:
      - psexec.c
      - psexec64.c
  condition: selection
falsepositives:
  - Administrative activity
  - SCCM endpoint management
level: medium
