title: 'FP Filter: PsExec from SCCM management agents'
name: filter_550e8400
status: experimental
description: "Suppresses PsExec invocations where the parent is a known SCCM component. Does NOT suppress PsExec from shells, scheduled tasks, or WMI parents.\n"
logsource:
  category: process_creation
  product: windows
rules:
- 4a6a3b37-1bef-4741-ae2d-c34cca8c8e77
filter:
  known_fp_sccm_agent:
    ParentImage|endswith:
    - \CCM\ccmexec.exe
    - \SMS\Bin\ccmsetup.exe
condition: not known_fp_sccm_agent
