ddr_version: "0.4"
id: 3b8c1e5d-7f92-4a06-b3d8-2e1f9c047a5b
title: "Suppress: Windows Lateral Movement — PsExec SCCM admin activity"
description: >
  The "Windows Lateral Movement - PsExec" savedsearch in Splunk_TA_windows fires on all
  PsExec executions including legitimate SCCM-initiated patch deployments. The IT Operations
  team runs PsExec via SCCM on all corp workstations during maintenance windows
  (every Tuesday 22:00-02:00 UTC). This DDR suppresses that specific FP pattern.

  Generated with: ddr new --target splunk savedsearches.conf --name "Windows Lateral Movement - PsExec"

target:
  kind: splunk
  query_ref:
    name: Windows Lateral Movement - PsExec
    app: Splunk_TA_windows
    query_hash: sha256:4b90170ef512ff50158ae9d9708853695f74caaaeaf942697ccc4075746cddf3
    path_or_url: "examples/07-splunk-multi-stanza-app/savedsearches.conf"

decision:
  kind: suppress
  rationale: >
    SCCM executes PsExec under the domain service account svc_sccm_deploy during weekly
    patch windows. This is authorized, documented in ITSM-4421, and operationally distinct
    from lateral movement (process parent is sccm.exe, destination is corp workstations
    only, no interactive session spawned).
  tuning:
    kind: splunk
    filter_title: "FP Filter: SCCM-initiated PsExec during maintenance windows"
    filter_description: >
      Suppress PsExec alerts triggered by svc_sccm_deploy. Does NOT suppress PsExec
      from any other account or outside the maintenance window IP range.
    splunk_filter: "user=\"svc_sccm_deploy\" AND parent_process=\"sccm.exe\""

