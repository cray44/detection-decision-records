# savedsearches.conf — Splunk_TA_windows (excerpt)
# Multi-stanza conf showing stanza selection with ddr new --name

[Windows Lateral Movement - PsExec]
search = index=wineventlog source="WinEventLog:Security" EventCode=4688 \
  process_name="PsExec.exe" OR process_name="PsExec64.exe"
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */15 * * * *
alert.threshold = 1

[Windows Privileged Account Use - Admin Share Access]
search = index=wineventlog source="WinEventLog:Security" EventCode=5140 \
  share_name="ADMIN$" OR share_name="C$"
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */15 * * * *
alert.threshold = 1

[Windows Service Creation - Suspicious Path]
search = index=wineventlog source="WinEventLog:System" EventCode=7045 \
  service_path IN ("*\\Temp\\*", "*\\AppData\\*", "*\\ProgramData\\*")
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */15 * * * *
alert.threshold = 1
