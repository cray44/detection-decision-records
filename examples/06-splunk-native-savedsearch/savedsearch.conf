# savedsearches.conf (excerpt)
# Detection: Excessive Failed Logins from Single Source
# App: DA-ESS-AccessProtection
# Alert fires when a single src_ip generates >50 failed authentications in 1 hour.
# Noisy because:
#   - Vulnerability scanners (Nessus, Qualys) trigger during credentialed scan windows
#   - Service accounts doing LDAP health checks generate bursts during cert rotation

[Excessive Failed Logins From Single Source]
search = index=auth sourcetype=linux_secure action=failure \
  | stats count by src_ip, user \
  | where count > 50
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
cron_schedule = */15 * * * *
alert.threshold = 1
alert.condition = search count > 0
