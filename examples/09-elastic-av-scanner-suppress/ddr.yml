ddr_version: "0.6"
id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
title: "Suppress: Windows Defender AV scan alerts from Nessus vulnerability scanner"
description: >
  The Nessus vulnerability scanner on the 10.0.100.0/24 management VLAN
  triggers Windows Defender AV threat detection events during active scan
  windows. Defender flags the scanner's payload delivery mechanism
  (MpCmdRun.exe -Scan) against temp files created by the scanner agent.
  All events have been confirmed as scanner traffic via DHCP/DNS records
  and correlation with Nessus scan schedules. Not malicious activity.

target:
  kind: elastic
  query_refs:
    - rule_id: "96b9fc2a-cbd5-4a3e-b7d7-3d9d6a6e8d5c"
      name: "Windows Defender Antivirus Threats Detected"
      index_pattern: "logs-endpoint.events.process-*"
      content_hash: "sha256:4ce544936874426665b08433d5976d9cf76eb795e4f76e928d2c10f029bb7b5b"
      source: internal
      path_or_url: "examples/09-elastic-av-scanner-suppress/elastic-rule.ndjson"

decision:
  kind: suppress
  rationale: >
    Nessus scanner (10.0.100.0/24, agent names nessus-*) triggers Defender AV
    events during scheduled scan windows (Tue/Thu 02:00-04:00 UTC). Scanner
    traffic confirmed via:
    (1) DHCP records showing 10.0.100.0/24 is the dedicated Nessus VLAN,
    (2) DNS PTR records for individual scanner IPs,
    (3) Correlation of alert timestamps with Nessus scan schedule in Tenable.io.
    Zero true-positive events from this source class in 90 days of investigation.
    Suppression scoped to scanner CIDR + agent name prefix; must be revisited if
    scanner moves subnets or if new scanner agents are introduced.
  tuning:
    kind: elastic
    filter_title: "Suppress Nessus scanner AV alerts (management VLAN)"
    filter_description: >
      Suppresses Defender AV scan alerts sourced from the Nessus vulnerability
      scanner fleet on 10.0.100.0/24. Review if scanner VLAN changes.
    kql_filter: 'source.ip : "10.0.100.0/24" and agent.name : nessus*'

lifecycle:
  status: active
  created_on: "2026-05-08T00:00:00Z"
  activated_on: "2026-05-08T00:00:00Z"
  expires_on: "2027-05-08T00:00:00Z"
  review_cadence_days: 90
