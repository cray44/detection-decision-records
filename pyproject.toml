[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddr-detect"
version = "0.6.0"
description = "Detection Decision Records — governance/operational layer for detection-as-code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Chris Ray" }]
keywords = ["sigma", "detection-engineering", "detection-as-code", "governance", "siem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "jsonschema>=4.21",
    "pysigma>=0.11",
]

[project.scripts]
ddr = "ddr.cli:app"

[project.urls]
Homepage = "https://github.com/cray44/detection-decision-records"
Issues = "https://github.com/cray44/detection-decision-records/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ddr"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "B008",  # Typer requires function calls in argument defaults
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/ddr"]
branch = true
